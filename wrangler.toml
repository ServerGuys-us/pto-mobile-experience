# PTO Mobile Experience — Cloudflare Pages Configuration
# https://developers.cloudflare.com/pages/

name = "pto-mobile-experience"
compatibility_date = "2024-09-23"

# Pages project root — all HTML/CSS/JS files are served from here
# No build command needed (pure static HTML)
# Build output directory is the repo root

# ── Environment Variables ────────────────────────────────────
# Set these in Cloudflare Dashboard:
#   Pages → Your Project → Settings → Environment Variables
#
# DO NOT put real values here — use the Dashboard or .dev.vars for local dev
[vars]
# Placeholder — actual values set in Dashboard
SITE_URL = "https://ptomobileexperience.com"

# ── Bindings (future use) ────────────────────────────────────
